name: Claude

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    # Roda em issues/PRs rotulados "claude" ou quando mencionado com @claude (apenas o dono do repo).
    if: >
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'claude') || contains(github.event.issue.body, '@claude'))) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(node:*)"
          prompt: |
            Você é o mantenedor autônomo do ADAPTA MAESTRO (portal pediátrico).
            Resolva a pendência descrita (issue/PR/comentário) abrindo um PR em branch
            "claude/<assunto>-<data>". Nunca faça push direto na main. Não altere doses,
            posologias ou conteúdo clínico sem fonte citada no PR; sinalize dúvidas clínicas
            para revisão humana.
