<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Ropivacaína — atualização de 18 de outubro de 2026</title><desc id="desc">Card clínico sobre concentrações, doses pediátricas e alertas de segurança da ropivacaína.</desc><rect width="1080" height="1350" fill="#07111f"/><rect x="56" y="52" width="968" height="1246" rx="28" fill="#0d2138" stroke="#59c3ff" stroke-width="3"/><text x="96" y="130" fill="#83ddff" font-family="Arial, sans-serif" font-size="34" font-weight="700">CATÁLOGO PEDIÁTRICO • 18/10/2026</text><text x="96" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="60" font-weight="800">ROPIVACAÍNA</text><text x="96" y="260" fill="#c9eaff" font-family="Arial, sans-serif" font-size="30">Doses pediátricas, limites e segurança</text><rect x="86" y="310" width="908" height="252" rx="22" fill="#123456"/><text x="120" y="366" fill="#73e0b5" font-family="Arial, sans-serif" font-size="31" font-weight="700">O QUE MUDOU</text><text x="120" y="416" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">• Brasil: frascos de 20 mL em 2, 7,5 e 10 mg/mL.</text><text x="120" y="462" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">• Pediatria: os esquemas documentados usam somente 2 mg/mL.</text><text x="120" y="508" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">• Caudal e peridural: classe A; bloqueio periférico: classe C.</text><rect x="86" y="588" width="908" height="300" rx="22" fill="#123456"/><text x="120" y="644" fill="#ffd166" font-family="Arial, sans-serif" font-size="31" font-weight="700">NA PRÁTICA</text><text x="120" y="696" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">• Caudal único: 2 mg/kg = 1 mL/kg; máximo 25 mL (50 mg).</text><text x="120" y="742" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">• Infusão &lt;6 meses: 0,2 mg/kg/h = 0,1 mL/kg/h.</text><text x="120" y="788" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">• Infusão 6 meses–12 anos: 0,4 mg/kg/h = 0,2 mL/kg/h.</text><text x="120" y="834" fill="#d7efff" font-family="Arial, sans-serif" font-size="24">Exemplo 10 kg: 20 mg ÷ 2 mg/mL = 10 mL; reversa = 2 mg/kg.</text><rect x="86" y="914" width="908" height="228" rx="22" fill="#3a1722" stroke="#ff7f8f" stroke-width="2"/><text x="120" y="970" fill="#ff9cab" font-family="Arial, sans-serif" font-size="31" font-weight="700">ATENÇÃO</text><text x="120" y="1018" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">• Nunca administrar por via intravenosa; uso em prematuros não documentado.</text><text x="120" y="1060" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">• Monitorização contínua e recursos para toxicidade sistêmica.</text><text x="120" y="1102" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">• Dupla checagem de peso, concentração, via, dose e bomba.</text><text x="96" y="1195" fill="#83ddff" font-family="Arial, sans-serif" font-size="24" font-weight="700">FONTES: CRISTÁLIA/ANVISA • EMC • IVANI ET AL.</text><line x1="96" y1="1220" x2="984" y2="1220" stroke="#4a6f91"/><text x="96" y="1256" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Siglas e significados</text><text x="96" y="1288" fill="#c9eaff" font-family="Arial, sans-serif" font-size="21">ANVISA: Agência Nacional de Vigilância Sanitária • eMC: electronic Medicines Compendium</text><text x="96" y="1318" fill="#c9eaff" font-family="Arial, sans-serif" font-size="21">mg: miligrama • mL: mililitro • h: hora • kg: quilograma</text></svg>
