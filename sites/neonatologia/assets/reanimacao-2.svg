<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1430" role="img" aria-labelledby="title2"><title id="title2">Fluxograma SBP 2026, RN &lt;34 semanas</title><rect width="1000" height="1430" fill="white"/><text x="40" y="38" font-family="Arial" font-size="25" fill="#102a43">Reanimação neonatal — &lt;34 semanas</text><defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334e68"/></marker></defs><path d="M250 160 V205" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><path d="M250 295 V345" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="260" y="326" font-family="Arial" font-size="17" fill="#102a43">Sim</text><path d="M460 250 H560" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="490" y="240" font-family="Arial" font-size="17" fill="#102a43">Não</text><path d="M250 435 V485" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><path d="M250 575 V625" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="260" y="605" font-family="Arial" font-size="17" fill="#102a43">Não</text><path d="M460 530 H760 V385" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="500" y="519" font-family="Arial" font-size="17" fill="#102a43">Sim</text><path d="M250 735 V785" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><path d="M250 885 V935" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="260" y="919" font-family="Arial" font-size="17" fill="#102a43">&lt;60</text><path d="M460 835 H560" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="480" y="824" font-family="Arial" font-size="17" fill="#102a43">≥60</text><path d="M250 1035 V1085" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><path d="M250 1185 V1235" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="260" y="1218" font-family="Arial" font-size="17" fill="#102a43">&lt;60</text><path d="M460 1135 H560" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><text x="480" y="1124" font-family="Arial" font-size="17" fill="#102a43">&gt;60</text><path d="M40 1295 H15 V985 H40" fill="none" stroke="#334e68" stroke-width="2.5" marker-end="url(#arr2)"/><rect x="40" y="70" width="420" height="90" rx="12" fill="#f8fafc" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="109.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">Vitalidade, cordão, proteção térmica;</text><text x="250.0" y="132.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">ECG e SpO₂</text><rect x="40" y="205" width="420" height="90" rx="12" fill="#eff6ff" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="255.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">Apneia/respiração irregular ou FC &lt;100?</text><rect x="40" y="345" width="420" height="90" rx="12" fill="#f8fafc" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="384.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">VPP com O₂ 60%; iniciar até 60 s de</text><text x="250.0" y="407.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">vida. Reavaliar após 30 s.</text><rect x="40" y="485" width="420" height="90" rx="12" fill="#eff6ff" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="524.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC ≥100 e respiração espontânea</text><text x="250.0" y="547.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">regular?</text><rect x="40" y="625" width="420" height="110" rx="12" fill="#f8fafc" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="662.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">Corrigir VPP. Se falha: interface</text><text x="250.0" y="685.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">alternativa e/ou intubação; confirmar</text><text x="250.0" y="708.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">ventilação eficaz.</text><rect x="40" y="785" width="420" height="100" rx="12" fill="#eff6ff" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="840.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC após 30 s de VPP traqueal eficaz?</text><rect x="40" y="935" width="420" height="100" rx="12" fill="#fff1f2" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="979.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC &lt;60: compressões 3:1 + VPP traqueal</text><text x="250.0" y="1002.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">com O₂ 100%, por ≥60 s</text><rect x="40" y="1085" width="420" height="100" rx="12" fill="#eff6ff" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="1140.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">Reavaliar FC, ventilação e compressões</text><rect x="40" y="1235" width="420" height="120" rx="12" fill="#fff1f2" stroke="#486581" stroke-width="1.5"/><text x="250.0" y="1277.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC &lt;60: adrenalina IV/IO; manter VPP +</text><text x="250.0" y="1300.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">compressões; investigar</text><text x="250.0" y="1323.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">hipovolemia/causas reversíveis.</text><rect x="560" y="205" width="400" height="180" rx="12" fill="#f0fdf4" stroke="#486581" stroke-width="1.5"/><text x="760.0" y="266.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC ≥100 e respiração espontânea:</text><text x="760.0" y="289.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">CPAP 5–6 cmH₂O se desconforto e/ou</text><text x="760.0" y="312.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">SpO₂ baixa; caso contrário,</text><text x="760.0" y="335.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">observar.</text><rect x="560" y="785" width="400" height="110" rx="12" fill="#f8fafc" stroke="#486581" stroke-width="1.5"/><text x="760.0" y="811.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC 60–99 e/ou apneia: manter VPP</text><text x="760.0" y="834.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">eficaz e reavaliar; FC ≥100 com</text><text x="760.0" y="857.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">respiração regular: cuidados pós-</text><text x="760.0" y="880.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">reanimação.</text><rect x="560" y="1085" width="400" height="150" rx="12" fill="#f0fdf4" stroke="#486581" stroke-width="1.5"/><text x="760.0" y="1119.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">FC &gt;60: suspender compressões,</text><text x="760.0" y="1142.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">titular O₂ e manter VPP se</text><text x="760.0" y="1165.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">necessária. FC ≥100 + respiração</text><text x="760.0" y="1188.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">regular: suspender VPP;</text><text x="760.0" y="1211.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#102a43">observar/estabilizar.</text><text x="40" y="1395" font-family="Arial" font-size="17" fill="#334e68">FC exatamente 60: confirmar leitura/tendência prontamente; manter suporte. Ver texto técnico.</text></svg>